<script>
const BASE='https://tiles.basemaps.cartocdn.com/v/20261001-03';
const CARTO_TILES=BASE+'/vectortiles/carto.streets/v2/{z}/{x}/{y}.mvt';
const SAT_TILES='https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
const FONT_STACK=['Montserrat SemiBold','Open Sans Bold','Noto Sans Regular','Noto Sans CJK JP Regular'];
const YOU=[-75.2330,4.4388];
const heightExpr=['coalesce',['get','height'],9];
let M_LNG=111000; const M_LAT=110600;
const normAng=a=>((a+540)%360)-180;
const fmtDist=d=>d>=1000? (d/1000).toFixed(1).replace('.',',')+' km' : Math.round(d)+' m';

function ilustradoStyle(){return {version:8,
 glyphs:BASE+'/fonts/{fontstack}/{range}.pbf',
 sources:{carto:{type:'vector',tiles:[CARTO_TILES],minzoom:0,maxzoom:15}},
 layers:[
  {id:'fondo',type:'background',paint:{'background-color':'#B9E39A'}},
  {id:'tierra',source:'carto','source-layer':'land',type:'fill',paint:{'fill-color':'#A5DC86','fill-opacity':0.9}},
  {id:'agua',source:'carto','source-layer':'water',type:'fill',paint:{'fill-color':'#4FB6F5'}},
  {id:'edificios',source:'carto','source-layer':'buildings',type:'fill',minzoom:13,paint:{'fill-color':'#F7DCB9','fill-outline-color':'#E3B77E'}},
  {id:'calles-borde',source:'carto','source-layer':'roads',type:'line',minzoom:10,layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#D8D2C0','line-width':['interpolate',['linear'],['zoom'],12,2,15,10]}},
  {id:'calles',source:'carto','source-layer':'roads',type:'line',minzoom:10,layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#FFFFFF','line-width':['interpolate',['linear'],['zoom'],12,1.4,15,7.5]}},
  {id:'nombres-calles',source:'carto','source-layer':'roads',type:'symbol',minzoom:13.5,layout:{'symbol-placement':'line','text-field':['get','name'],'text-font':FONT_STACK,'text-size':12.5},paint:{'text-color':'#6B6257','text-halo-color':'#FFFFFF','text-halo-width':1.6}},
  {id:'nombres-lugares',source:'carto','source-layer':'places',type:'symbol',minzoom:12.5,layout:{'text-field':['get','name'],'text-font':FONT_STACK,'text-size':13.5},paint:{'text-color':'#2F5D33','text-halo-color':'#FFFFFF','text-halo-width':1.8}}
 ]};}
function satStyle(){return {version:8,sources:{
  sat:{type:'raster',tiles:[SAT_TILES],tileSize:256,maxzoom:18},
  carto:{type:'vector',tiles:[CARTO_TILES],minzoom:0,maxzoom:15}},
 layers:[
  {id:'sat',type:'raster',source:'sat'},
  {id:'calles-sat',source:'carto','source-layer':'roads',type:'line',minzoom:12,paint:{'line-color':'rgba(255,255,255,0.55)','line-width':1.6}}
 ]};}
function mapa3dStyle(){return {version:8,sources:{
  carto:{type:'vector',tiles:[CARTO_TILES],minzoom:0,maxzoom:15}},
 layers:[
  {id:'fondo',type:'background',paint:{'background-color':'#E8F0E4'}},
  {id:'agua',source:'carto','source-layer':'water',type:'fill',paint:{'fill-color':'#8FC1E3'}},
  {id:'parques',source:'carto','source-layer':'land',type:'fill',paint:{'fill-color':'#BEE3B0','fill-opacity':0.8}},
  {id:'calles-borde',source:'carto','source-layer':'roads',type:'line',minzoom:10,paint:{'line-color':'#C9C2B4','line-width':['interpolate',['linear'],['zoom'],12,1.5,15,7]}},
  {id:'calles',source:'carto','source-layer':'roads',type:'line',minzoom:10,paint:{'line-color':'#FFFFFF','line-width':['interpolate',['linear'],['zoom'],12,1,15,5]}},
  {id:'edificios-3d',source:'carto','source-layer':'buildings',type:'fill-extrusion',minzoom:13,paint:{'fill-extrusion-color':'#EFC98C','fill-extrusion-height':heightExpr,'fill-extrusion-base':0,'fill-extrusion-opacity':0.95}}
 ]};}
function actualStyle(){return {version:8,sources:{
  osm:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,maxzoom:19}},
 layers:[{id:'osm',type:'raster',source:'osm'}]};}

window.map=new maplibregl.Map({container:'map',style:ilustradoStyle(),center:[-75.2362,4.4425],zoom:14.7,pitch:0,bearing:0,attributionControl:false,fadeDuration:0});

/* ---------- Ruta ---------- */
function curva(pts,muestras){
  const P=[pts[0],...pts,pts[pts.length-1]],salida=[];
  for(let i=0;i<P.length-3;i++){
    for(let j=0;j<muestras;j++){
      const t=j/muestras,t2=t*t,t3=t2*t,p0=P[i],p1=P[i+1],p2=P[i+2],p3=P[i+3];
      salida.push([
        0.5*((2*p1[0])+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),
        0.5*((2*p1[1])+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)
      ]);
    }
  }
  salida.push(pts[pts.length-1]);
  return salida;
}
function rutaSuave(a,b){
  const dx=(b[0]-a[0])*M_LNG, dy=(b[1]-a[1])*M_LAT, len=Math.hypot(dx,dy)||1;
  const px=-dy/len, py=dx/len, off1=len*0.16, off2=len*0.11;
  const m1=[a[0]+(b[0]-a[0])*0.35 + px*off1/M_LNG, a[1]+(b[1]-a[1])*0.35 + py*off1/M_LAT];
  const m2=[a[0]+(b[0]-a[0])*0.70 - px*off2/M_LNG, a[1]+(b[1]-a[1])*0.70 - py*off2/M_LAT];
  return curva([a,m1,m2,b],16);
}
let RUTA=rutaSuave(YOU,[-75.23657,4.444974]);
function datosRuta(){return {type:'Feature',geometry:{type:'LineString',coordinates:RUTA}};}
function aplicarEstiloCarretera(){
  try{
    const m=window.map;
    if(rutaEsReal){
      m.setPaintProperty('car-sombra','line-opacity',1);
      m.setPaintProperty('car-borde','line-opacity',1);
      m.setPaintProperty('car-asfalto','line-opacity',1);
      m.setPaintProperty('car-linea','line-color','#FFFFFF');
      m.setPaintProperty('car-linea','line-width',3.8);
      m.setPaintProperty('car-linea','line-dasharray',[2.4,2.6]);
      m.setPaintProperty('car-linea','line-opacity',1);
    }else{
      m.setPaintProperty('car-sombra','line-opacity',0);
      m.setPaintProperty('car-borde','line-opacity',0);
      m.setPaintProperty('car-asfalto','line-opacity',0);
      m.setPaintProperty('car-linea','line-color','#666666');
      m.setPaintProperty('car-linea','line-width',5);
      m.setPaintProperty('car-linea','line-dasharray',[2.5,2.5]);
      m.setPaintProperty('car-linea','line-opacity',0.9);
    }
  }catch(err){}
}
function asegurarRuta(){ try{
  if(!window.map.getSource('carretera')) window.map.addSource('carretera',{type:'geojson',data:datosRuta()});
  let beforeId;
  try{const layers=window.map.getStyle().layers; const sym=layers.find(l=>l.type==='symbol'); if(sym)beforeId=sym.id;}catch(err){}
  const L=(id,paint,layout)=>{if(!window.map.getLayer(id))window.map.addLayer({id,type:'line',source:'carretera',layout:layout||{'line-cap':'round','line-join':'round'},paint},beforeId);};
  L('car-sombra',{'line-color':'rgba(0,0,0,0.20)','line-width':50,'line-blur':6});
  L('car-borde',{'line-color':'#FFFFFF','line-width':44});
  L('car-asfalto',{'line-color':'#22262E','line-width':36});
  if(!window.map.getLayer('car-linea'))window.map.addLayer({id:'car-linea',type:'line',source:'carretera',layout:{'line-cap':'butt','line-join':'round'},paint:{'line-color':'#FFFFFF','line-width':3.8,'line-dasharray':[2.4,2.6]}},beforeId);
  if(!window.map.getSource('recorrido')) window.map.addSource('recorrido',{type:'geojson',data:{type:'Feature',geometry:{type:'LineString',coordinates:trackPts}}});
  if(!window.map.getLayer('recorrido-linea'))window.map.addLayer({id:'recorrido-linea',type:'line',source:'recorrido',paint:{'line-color':'#2E7CF6','line-width':5,'line-opacity':0.85}});
  aplicarEstiloCarretera();
  actualizarTrack();
 }catch(e){}
}
window.map.on('style.load',asegurarRuta);
window.map.on('styledata',asegurarRuta);
function pintarDatosRuta(){try{const s=window.map.getSource('carretera'); if(s) s.setData(datosRuta()); else asegurarRuta();}catch(e){}}
let rutaToken=0, rutaEsReal=false, rutaDistancia=null;
let perfil='driving', pasos=[], pasosAlong=[], rutaDuracion=0, ultimoSnap=null, contadorDesvio=0, trackPts=[], estadoRuta='calculando';
function actualizarTrack(){try{const s=window.map.getSource('recorrido'); if(s) s.setData({type:'Feature',geometry:{type:'LineString',coordinates:trackPts}});}catch(e){}}
function pedirRuta(b,intento,miToken){
  const prof2={driving:'car',walking:'foot',cycling:'bike'}[perfil]||'car';
  const hosts=[
    `https://router.project-osrm.org/route/v1/${perfil}/`,
    `https://routing.openstreetmap.de/routed-${prof2}/route/v1/${perfil}/`
  ];
  const url=hosts[intento%2]+`${YOU[0]},${YOU[1]};${b.lng},${b.lat}?overview=full&geometries=geojson&steps=true`;
  fetch(url).then(r=>{if(!r.ok)throw new Error('http '+r.status);return r.json();}).then(j=>{
    if(miToken!==rutaToken||!j.routes||!j.routes[0]||seleccionado!==b)throw new Error('vieja');
    const coords=j.routes[0].geometry.coordinates;
    if(!coords||coords.length<2)throw new Error('sin ruta');
    RUTA=coords; rutaEsReal=true; estadoRuta='real'; rutaDistancia=j.routes[0].distance;
    pasos=(j.routes[0].legs[0]&&j.routes[0].legs[0].steps)||[];
    rutaDuracion=j.routes[0].duration||0;
    construirRuta();
    pasosAlong=pasos.map(st=>puntoMasCercano(st.maneuver.location).along);
    pintarDatosRuta();
    aplicarEstiloCarretera();
    document.getElementById('cAviso').textContent='';
    mostrarBotonesViaje();
    if(tripActivo){actualizarRestante(); actualizarBanner();}
    else actualizarDistancia();
  }).catch(()=>{
    if(miToken!==rutaToken||seleccionado!==b)return;
    if(intento<3){setTimeout(()=>pedirRuta(b,intento+1,miToken),intento===0?1500:3000);}
    else{
      estadoRuta='fallida';
      document.getElementById('cAviso').textContent='Sin ruta por carretera desde tu ubicación. La línea punteada es solo una referencia.';
      mostrarBotonesViaje();
    }
  });
}
function recalcularRuta(){
  if(!seleccionado)return;
  lastRouteFrom=[...YOU]; lastRouteAt=Date.now();
  RUTA=rutaSuave(YOU,[seleccionado.lng,seleccionado.lat]);
  construirRuta(); pintarDatosRuta();
  aplicarEstiloCarretera();
  rutaEsReal=false; rutaDistancia=null; pasos=[]; pasosAlong=[]; estadoRuta='calculando';
  document.getElementById('bannerTurno').style.display='none';
  mostrarBotonesViaje();
  const token=++rutaToken;
  pedirRuta(seleccionado,0,token);
}
function textoManeuver(st){
  const m=st.maneuver||{}, mod=m.modifier||'';
  const calle=st.name?(' en '+st.name):'';
  if(m.type==='arrive')return 'Llegaste a tu destino';
  if(m.type==='depart')return 'Inicia el viaje'+calle;
  if(m.type==='roundabout')return 'En la glorieta, sigue'+calle;
  const giro={left:'Gira a la izquierda',right:'Gira a la derecha','slight left':'Gira levemente a la izquierda','slight right':'Gira levemente a la derecha','sharp left':'Gira cerrada a la izquierda','sharp right':'Gira cerrada a la derecha',uturn:'Da la vuelta'}[mod];
  if(giro)return giro+calle;
  return 'Sigue recto'+calle;
}
function flechaSVG(st){
  const m=st.maneuver||{};
  if(m.type==='arrive')return `<svg width="30" height="30" viewBox="0 0 24 24"><path d="M12 2 C8 2 5 5 5 9 C5 14 12 22 12 22 C12 22 19 14 19 9 C19 5 16 2 12 2 Z" fill="#fff"/><circle cx="12" cy="9" r="3" fill="#14342B"/></svg>`;
  const deg={left:-90,right:90,'slight left':-45,'slight right':45,'sharp left':-135,'sharp right':135,uturn:180}[m.modifier||'']||0;
  return `<svg width="30" height="30" viewBox="0 0 24 24" style="transform:rotate(${deg}deg);flex:none"><path d="M12 2 L19 13 H14 V22 H10 V13 H5 Z" fill="#fff"/></svg>`;
}
function actualizarBanner(){
  const ban=document.getElementById('bannerTurno');
  if(!tripActivo||!pasos.length||!ultimoSnap){ban.style.display='none';return;}
  let idx=pasos.findIndex((st,i)=>pasosAlong[i]>ultimoSnap.along+5);
  if(idx<0)idx=pasos.length-1;
  const st=pasos[idx];
  const dist=Math.max(0,pasosAlong[idx]-ultimoSnap.along);
  let idxCalle=0;
  pasosAlong.forEach((a,i)=>{if(a<=ultimoSnap.along)idxCalle=i;});
  const calleActual=(pasos[idxCalle]&&pasos[idxCalle].name)||'esta vía';
  const rest=Math.max(0,total-ultimoSnap.along);
  const eta=rutaDuracion&&rutaDistancia?Math.max(1,Math.round((rest/rutaDistancia)*(rutaDuracion/60))):null;
  ban.innerHTML=`<div style="display:flex;gap:10px;align-items:center">${flechaSVG(st)}<div><div style="font-size:16px;font-weight:800">En ${fmtDist(dist)} · ${textoManeuver(st)}</div><div style="font-size:12.5px;opacity:.85">Vas por ${calleActual}${eta?` · Llegas en ~${eta} min`:''}</div></div></div>`;
  ban.style.display='block';
}
function actualizarDistancia(){
  const el=document.getElementById('cDist'); if(!el)return;
  const dist=(rutaEsReal&&rutaDistancia)?rutaDistancia:total;
  el.innerHTML= rutaEsReal? `Ruta por las calles · a <b>${fmtDist(dist)}</b> de aquí` : `A <b>${fmtDist(dist)}</b> de aquí`;
}

/* ---------- Segmentos y punto más cercano (la mascota sigue SU posición real) ---------- */
let segs=[],total=0;
function construirRuta(){
  segs=[];total=0;
  for(let i=0;i<RUTA.length-1;i++){
    const dx=(RUTA[i+1][0]-RUTA[i][0])*M_LNG, dy=(RUTA[i+1][1]-RUTA[i][1])*M_LAT;
    const len=Math.hypot(dx,dy);
    const brg=(Math.atan2(dx,dy)*180/Math.PI+360)%360;
    segs.push({a:RUTA[i],b:RUTA[i+1],len,brg,cum:total}); total+=len;
  }
}
function puntoMasCercano(pos){
  const px=pos[0]*M_LNG, py=pos[1]*M_LAT;
  let mejor=null;
  for(const s of segs){
    const ax=s.a[0]*M_LNG, ay=s.a[1]*M_LAT, bx=s.b[0]*M_LNG, by=s.b[1]*M_LAT;
    const abx=bx-ax, aby=by-ay, l2=abx*abx+aby*aby||1;
    let t=((px-ax)*abx+(py-ay)*aby)/l2; t=Math.max(0,Math.min(1,t));
    const cx=ax+abx*t, cy=ay+aby*t, d=Math.hypot(px-cx,py-cy);
    if(!mejor||d<mejor.dist) mejor={c:[cx/M_LNG,cy/M_LAT],brg:s.brg,along:s.cum+t*s.len,dist:d};
  }
  return mejor||{c:RUTA[RUTA.length-1],brg:0,along:total,dist:1e9};
}

/* ---------- Pines ---------- */
function glyph(kind,color){
  if(kind==='paw')return `<svg width="17" height="17" viewBox="0 0 24 24" fill="${color}"><ellipse cx="12" cy="15.5" rx="4.2" ry="3.4"/><circle cx="4.6" cy="10.5" r="1.9"/><circle cx="8.2" cy="6.8" r="2"/><circle cx="12.6" cy="5.9" r="2"/><circle cx="16.9" cy="7.6" r="1.9"/><circle cx="19.6" cy="11.4" r="1.7"/></svg>`;
  if(kind==='cross')return `<svg width="16" height="16" viewBox="0 0 24 24" fill="${color}"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/></svg>`;
  return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2.4"><path d="M5 8h14l-1.2 12.2a1.8 1.8 0 0 1-1.8 1.8H8a1.8 1.8 0 0 1-1.8-1.8L5 8z"/><path d="M8.5 10V6.5a3.5 3.5 0 0 1 7 0V10"/></svg>`;
}
const CAT={
  vet:{cls:'green',g:'paw',col:'#22A355',nombre:'Veterinaria'},

};
const CIUDADES={
  ibague:{nombre:'Ibagué', centro:[-75.2362,4.4425], zoom:14.7, tz:'America/Bogota', mlng:111000, datos:NEGOCIOS_IBAGUE},
  charlotte:{nombre:'Charlotte', centro:[-80.84,35.22], zoom:11.8, tz:'America/New_York', mlng:90850, datos:NEGOCIOS_CHARLOTTE}
};
let ciudadActual='ibague', NEGOCIOS=NEGOCIOS_IBAGUE;
const marcadores=[];
function crearPines(){
  NEGOCIOS.forEach(b=>{

crearPines();
function cargarCiudad(id,volar){
  const c=CIUDADES[id]; if(!c)return;
  ciudadActual=id; NEGOCIOS=c.datos; M_LNG=c.mlng;
  marcadores.forEach(m=>m.mk.remove());
  marcadores.length=0;
  crearPines();
  document.querySelectorAll('.ciudadBtn').forEach(x=>x.classList.toggle('on',x.dataset.ciudad===id));
  aplicarFiltros();
  if(volar) window.map.easeTo({center:c.centro,zoom:c.zoom});
  seleccionar(NEGOCIOS[0],false);
}
function distanciaACiudad(id){
  let mejor=1e18;
  for(const b of CIUDADES[id].datos){
    const dx=(b.lng-YOU[0])*111000, dy=(b.lat-YOU[1])*110600;
    const d=Math.hypot(dx,dy);
    if(d<mejor)mejor=d;
  }
  return mejor;
}
const youEl=document.createElement('div');youEl.className='you';
const youMarker=new maplibregl.Marker({element:youEl}).setLngLat(YOU).addTo(window.map);

/* ---------- Estado de navegación ---------- */
let seleccionado=null, tripActivo=false, llegadaEn=null;
let follow=true, followPausado=false, camBearing=0;
let lastRouteFrom=[...YOU], lastRouteAt=0, gpsListo=false, ultimoFix=null;
function mostrarBotonesViaje(){
  const ini=document.getElementById('bIniciar');
  if(tripActivo){
    document.getElementById('filaIniciar').style.display='none';
    document.getElementById('filaTerminar').style.display='';
  }else{
    document.getElementById('filaIniciar').style.display='';
    document.getElementById('filaTerminar').style.display='none';
    if(estadoRuta==='real'){ini.disabled=false; ini.textContent='Iniciar viaje'; ini.style.opacity='';}
    else if(estadoRuta==='calculando'){ini.disabled=true; ini.textContent='Calculando ruta…'; ini.style.opacity='0.6';}
    else{ini.disabled=true; ini.textContent='Sin ruta por carretera'; ini.style.opacity='0.6';}
  }
}
function actualizarRestante(){
  if(!tripActivo||!seleccionado)return;
  const snap=puntoMasCercano(YOU); ultimoSnap=snap;
  const rest=Math.max(0,total-snap.along);
  document.getElementById('cDist').innerHTML=`Faltan <b>${fmtDist(rest)}</b> para llegar`;
  actualizarBanner();
  if(rest<50){llegar();return;}
  if(snap.dist>60){contadorDesvio++;} else {contadorDesvio=0;}
  if(contadorDesvio>=2){contadorDesvio=0; recalcularRuta();}
}
function llegar(){
  if(!seleccionado)return;
  tripActivo=false;
  llegadaEn=[seleccionado.lng,seleccionado.lat];
  document.getElementById('bannerTurno').style.display='none';
  document.getElementById('cDist').innerHTML=`¡Llegaste a <b>${seleccionado.n}</b>!`;
  mostrarBotonesViaje();
}
function terminarViaje(){
  tripActivo=false; llegadaEn=null;
  document.getElementById('bannerTurno').style.display='none';
  mostrarBotonesViaje();
  actualizarDistancia();
}
function iniciarViaje(){
  if(!seleccionado)return;
  tripActivo=true; llegadaEn=null; follow=true; followPausado=false;
  camBearing=window.map.getBearing();
  document.getElementById('btnGps').classList.add('on');
  trackPts=[[...YOU]]; actualizarTrack();
  mostrarBotonesViaje();
  actualizarRestante();
}

/* ---------- GPS real del teléfono (con filtro de ruido) ---------- */
function aceptarFix(lat,lng,acc){
  if(acc!=null&&acc>150) return false;
  if(ultimoFix){
    const dx=(lng-ultimoFix[0])*M_LNG, dy=(lat-ultimoFix[1])*M_LAT;
    if(Math.hypot(dx,dy)<8) return false;
  }
  ultimoFix=[lng,lat]; return true;
}
let ciudadAuto=false;
if(navigator.geolocation){
  navigator.geolocation.getCurrentPosition(p=>{
    if(!aceptarFix(p.coords.latitude,p.coords.longitude,p.coords.accuracy))return;
    YOU[0]=p.coords.longitude; YOU[1]=p.coords.latitude; youMarker.setLngLat(YOU);
    let cambioCiudad=false;
    if(!ciudadAuto){
      ciudadAuto=true;
      if(distanciaACiudad('charlotte')<distanciaACiudad('ibague')&&ciudadActual!=='charlotte'){cargarCiudad('charlotte',true); cambioCiudad=true;}
    }
    if(!gpsListo){gpsListo=true; if(!cambioCiudad&&seleccionado&&!tripActivo)seleccionar(seleccionado,false);}
  },()=>{},{enableHighAccuracy:true,timeout:10000});
  navigator.geolocation.watchPosition(p=>{
    if(!aceptarFix(p.coords.latitude,p.coords.longitude,p.coords.accuracy))return;
    YOU[0]=p.coords.longitude; YOU[1]=p.coords.latitude; youMarker.setLngLat(YOU);
    if(tripActivo){
      const ult=trackPts[trackPts.length-1];
      if(!ult||Math.hypot((YOU[0]-ult[0])*M_LNG,(YOU[1]-ult[1])*M_LAT)>15){trackPts.push([...YOU]); actualizarTrack();}
      actualizarRestante();
    }
    else{
      const dx=(YOU[0]-lastRouteFrom[0])*M_LNG, dy=(YOU[1]-lastRouteFrom[1])*M_LAT;
      if(seleccionado&&Math.hypot(dx,dy)>120&&Date.now()-lastRouteAt>20000)seleccionar(seleccionado,false);
    }
  },()=>{},{enableHighAccuracy:true,timeout:15000,maximumAge:5000});
}
/* Si el usuario arrastra el mapa, el seguimiento se pausa hasta recentrar */
['mousedown','touchstart','wheel'].forEach(ev=>window.map.on(ev,()=>{if(tripActivo)followPausado=true;}));

/* ---------- Tarjeta del negocio ---------- */
function horaCiudad(){const tz=(CIUDADES[ciudadActual]&&CIUDADES[ciudadActual].tz)||'America/Bogota';const d=new Date(new Date().toLocaleString('en-US',{timeZone:tz}));return d.getHours()+d.getMinutes()/60;}
function fmtHora(h){if(h==null)return '';const hh=Math.floor(h),mm=Math.round((h-hh)*60);const ap=hh<12?'a. m.':'p. m.';const h12=hh%12===0?12:hh%12;return h12+':'+String(mm).padStart(2,'0')+' '+ap;}
function seleccionar(b,volar){
  if(tripActivo)terminarViaje();
  llegadaEn=null;
  seleccionado=b;
  marcadores.forEach(m=>m.el.classList.toggle('sel',m.b===b));
  document.getElementById('cNombre').textContent=b.n;
  document.getElementById('cLogo').style.background=CAT[b.cat].col;
  document.getElementById('cLogo').innerHTML=glyph(CAT[b.cat].g,'#fff');
  document.getElementById('cEstrellas').textContent=b.rating?('★'.repeat(Math.round(b.rating))+' '+b.rating.toFixed(1)):'';
  let estado='';
  if(b.horas){
    const h=horaCiudad(),abierto=h>=b.horas[0]&&h<b.horas[1];
    estado=abierto?`<b>Abierto ahora</b> · cierra ${fmtHora(b.horas[1])}`:`<span class="cerrado">Cerrado ahora</span> · abre ${fmtHora(b.horas[0])}`;
  }
  document.getElementById('cEstado').innerHTML=estado;
  document.getElementById('cDir').textContent=b.dir+(b.nota?(' · '+b.nota):'');
  document.getElementById('bLlamar').href='tel:'+b.tel;
  document.getElementById('bWa').href='https://wa.me/'+b.tel.replace('+','');
  rutaEsReal=false; rutaDistancia=null; estadoRuta='calculando';
  pasos=[]; pasosAlong=[];
  document.getElementById('bannerTurno').style.display='none';
  document.getElementById('cAviso').textContent='Calculando ruta por las calles…';
  lastRouteFrom=[...YOU]; lastRouteAt=Date.now();
  RUTA=rutaSuave(YOU,[b.lng,b.lat]);
  construirRuta();
  pintarDatosRuta();
  aplicarEstiloCarretera();
  actualizarDistancia();
  mostrarBotonesViaje();
  const token=++rutaToken;
  pedirRuta(b,0,token);
  if(volar) window.map.easeTo({center:[b.lng,b.lat],zoom:Math.max(window.map.getZoom(),15)});
}
document.getElementById('bIr').addEventListener('click',()=>{if(seleccionado)seleccionar(seleccionado,true);});
document.getElementById('bIniciar').addEventListener('click',()=>iniciarViaje());
document.getElementById('bTerminar').addEventListener('click',()=>terminarViaje());

/* ---------- Filtros y buscador con sugerencias ---------- */

  marcadores.forEach(m=>{
    const okCat=filtroCat==='todos'||m.b.cat===filtroCat;
    const okTxt=!filtroTxt||m.b.n.toLowerCase().includes(filtroTxt);
    m.el.style.display=(okCat&&okTxt)?'':'none';
  });
}
document.getElementById('chips').addEventListener('click',e=>{
  const btn=e.target.closest('.chip');if(!btn)return;
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===btn));
  filtroCat=btn.dataset.cat;aplicarFiltros();
});
document.getElementById('buscador').addEventListener('input',e=>{filtroTxt=e.target.value.trim().toLowerCase();aplicarFiltros();renderSug();});
function renderSug(){
  const box=document.getElementById('sug');
  let lista=NEGOCIOS.filter(b=>!filtroTxt||b.n.toLowerCase().includes(filtroTxt));
  lista=lista.map(b=>{const dx=(b.lng-YOU[0])*M_LNG, dy=(b.lat-YOU[1])*M_LAT; return {b,d:Math.hypot(dx,dy)};}).sort((x,y)=>x.d-y.d);
  if(!lista.length||document.activeElement!==document.getElementById('buscador')){box.style.display='none';return;}
  box.innerHTML=lista.map(({b,d})=>{const c=CAT[b.cat];return `<div class="sugItem" data-i="${NEGOCIOS.indexOf(b)}"><span class="dot" style="background:${c.col};flex:none"></span><span><span class="nm">${b.n}</span><br><span class="cat">${c.nombre} · ${b.dir}</span></span><span style="margin-left:auto;font-size:12.5px;color:#0E7C66;font-weight:800;white-space:nowrap">a ${fmtDist(d)}</span></div>`;}).join('');
  box.style.display='block';
}
document.getElementById('buscador').addEventListener('focus',()=>renderSug());
document.getElementById('sug').addEventListener('click',e=>{
  const item=e.target.closest('.sugItem'); if(!item)return;
  const b=NEGOCIOS[+item.dataset.i];
  document.getElementById('sug').style.display='none';
  document.getElementById('buscador').blur();
  seleccionar(b,true);
});
document.addEventListener('click',e=>{

document.getElementById('bCompartir').addEventListener('click',async()=>{
  if(!seleccionado)return;
  const url=`https://www.google.com/maps/dir/?api=1&destination=${seleccionado.lat},${seleccionado.lng}`;

document.getElementById('bRutaCompleta').addEventListener('click',()=>{
  if(!RUTA.length)return;
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  RUTA.forEach(p=>{minX=Math.min(minX,p[0]);maxX=Math.max(maxX,p[0]);minY=Math.min(minY,p[1]);maxY=Math.max(maxY,p[1]);});
  window.map.fitBounds([[minX,minY],[maxX,maxY]],{padding:70});

});

/* ---------- La mascota: parte de TU ubicación y te sigue en el viaje ---------- */
const dogEl=document.createElement('div');
dogEl.innerHTML='<img id="dogImg" src="mascota/gstop.png" style="width:186px;height:auto;display:block;filter:drop-shadow(0 6px 7px rgba(0,0,0,.45))">';
const dog=new maplibregl.Marker({element:dogEl,anchor:'center'}).setLngLat(YOU).addTo(window.map);
const RUNF=['mascota/g1.png','mascota/g2.png','mascota/g3.png','mascota/g4.png'];
let lastSrc='';
function loop(now){
  const img=dogEl.firstElementChild;
  let src=null, rot='';
  if(tripActivo&&seleccionado){
    const snap=puntoMasCercano(YOU);
    dog.setLngLat(snap.c);
    src=RUNF[Math.floor(now/140)%4];
    let bEf=window.map.getBearing();
    if(follow&&!followPausado){
      const diff=normAng(snap.brg-camBearing);
      camBearing+=diff*0.07;
      window.map.jumpTo({center:snap.c,bearing:camBearing,zoom:16.8,pitch:55});
      bEf=camBearing;
    }
    rot=`rotate(${-90+normAng(snap.brg-bEf)}deg)`;
  } else if(llegadaEn){
    dog.setLngLat(llegadaEn);
    src='mascota/gstop.png';
  } else {
    dog.setLngLat(YOU);
    src='mascota/gstop.png';
  }
  if(src&&src!==lastSrc){img.src=src;lastSrc=src;}
  img.style.transform=rot;
  document.getElementById('aguja').style.transform=`rotate(${-window.map.getBearing()}deg)`;
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
seleccionar(NEGOCIOS[0],false);
